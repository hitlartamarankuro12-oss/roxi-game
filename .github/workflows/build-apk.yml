name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Package Web App into Artifact Structure
        run: |
          mkdir -p build-output
          cp index.html style.css game.js build-output/

      - name: Upload APK / Web Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: raxi-game-bundle
          path: build-output/
